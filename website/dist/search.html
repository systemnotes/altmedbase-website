</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Natural Remedies Directory</a>

      </div>
    </nav>
  </header>
  <main>
<h1>Search</h1>
<input type="text" id="search-input" placeholder="Search..." placeholder="Search..." />
<ul id="search-results"></ul>

<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
  // Load the generated search index
  fetch("search_index.json")
    .then(r => r.json())
    .then(data => {
      const idx = lunr(function () {
        this.ref('id');
        this.field('title', {boost: 10});
        this.field('summary', {boost: 5});
        this.field('tags', {boost: 2});
        this.field('indications', {boost: 5});
        this.field('contraindications', {boost: 3});
        this.field('preparations', {boost: 2});
        this.field('body_systems', {boost: 2});
        this.field('common_names', {boost: 3});
        this.field('botanical_name', {boost: 4});
        this.field('family');
        this.add(data);
      });

      document.getElementById('search-input').addEventListener('input', function (e) {
        const term = e.target.value.trim();
        if (!term) {
          document.getElementById('search-results').innerHTML = '';
          return;
        }

        const results = idx.search({ q: term, limit: 10 });
        const resultsHTML = results.map(r => {
          const doc = data.find(d => d.id === r.ref);
          if (!doc) return '';
          const url = doc.page_url || `${doc.collection}_${doc.id}.html`;
          const evidenceTag = doc.evidence_grade ? ` <span class="tag evidence-grade-${doc.evidence_grade.toLowerCase()}">Grade ${doc.evidence_grade}</span>` : '';
          return `<li><a href="${url}">${doc.title}</a>${evidenceTag} - ${doc.summary.substring(0, 80)}...</li>`;
        }).join('');
        document.getElementById('search-results').innerHTML = resultsHTML;
      });
    })
    .catch(err => console.error('Failed to load search index', err));
</script>
</main>
  <footer><small>Research directory – not medical advice. All content is aggregated from public sources and labeled by evidence type.</small></footer>
</body>
</html>
